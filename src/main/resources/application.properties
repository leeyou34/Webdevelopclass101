spring.application.name=todo-api

# ---------------------------------------------------------------
# 데이터베이스
# 기본값은 메모리 DB(H2)라서 별도 설치 없이 바로 실행됩니다. 재시작하면 데이터가 지워집니다.
# 운영에서는 환경변수로 PostgreSQL 또는 MySQL을 지정합니다.
#   DB_URL=jdbc:postgresql://localhost:5432/todo
#   DB_USERNAME=...  DB_PASSWORD=...
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:todo;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# 로그인 토큰(JWT)
# JWT_SECRET을 비워 두면 실행할 때마다 임시 키를 만듭니다(개발용).
# 운영에서는 32자 이상 임의 문자열을 반드시 환경변수로 넣습니다.
# ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:1d}

# 화면(프론트엔드) 주소. 여러 개는 쉼표로 구분합니다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# 초대 코드. 값을 넣으면 이 코드를 아는 사람만 가입할 수 있습니다(체험판 운영용).
app.signup.invite-code=${SIGNUP_INVITE_CODE:}
