name: CI

on:
  push:
    branches: [master, 'upgrade-*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --console=plain 2>&1 | tee build.log

      - name: Summarize failure
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, re, xml.etree.ElementTree as ET
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          errs = [l for l in lines if re.search(r'error:|FAILED|Exception|What went wrong|Could not', l)]
          print('::error title=build-errors::' + esc('\n'.join(errs[:80])))
          print('::error title=build-tail::' + esc('\n'.join(lines[-60:])))
          for f in glob.glob('build/test-results/test/*.xml'):
              for case in ET.parse(f).getroot().iter('testcase'):
                  fail = case.find('failure') if case.find('failure') is not None else case.find('error')
                  if fail is not None:
                      msg = (fail.get('message') or '') + '\n' + (fail.text or '')[:1500]
                      print('::error title=test ' + case.get('name') + '::' + esc(msg))
          EOF
